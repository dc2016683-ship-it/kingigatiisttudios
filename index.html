<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Kingi Gatini Studios</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    font-family:Arial, sans-serif;
    background: linear-gradient(135deg,#cfefff,#8fd3ff);
    color:#0f2a3a;
}

/* MENU */
.menu{
    width:260px;
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(10px);
    display:flex;
    flex-direction:column;
    padding:20px;
    border-right: 2px solid rgba(255,255,255,0.6);
}

h1{
    font-size:26px;
    text-align:center;
    color:#1e6fa8;
    margin-bottom:20px;
}

button{
    margin-bottom:15px;
    padding:12px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    background: linear-gradient(135deg,#6ec6ff,#a8ddff);
    color:white;
    font-weight:bold;
    transition:0.3s;
    box-shadow:0 5px 12px rgba(0,0,0,0.1);
}

button:hover{
    transform:scale(1.05);
}

/* CONTENIDO */
.contenido{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    padding:20px;
    font-size:20px;
}

/* GALERIA */
.galeria{
    display:flex;
    gap:15px;
    margin-top:15px;
}

.galeria a img{
    width:140px;
    border-radius:15px;
    box-shadow:0 8px 18px rgba(0,0,0,0.15);
    transition:0.3s;
}

.galeria a img:hover{
    transform:scale(1.08);
}

/* CONTACTO */
.contact-btn{
    display:inline-block;
    margin-top:20px;
    padding:12px 20px;
    background: linear-gradient(135deg,#6ec6ff,#a8ddff);
    color:white;
    border-radius:12px;
    text-decoration:none;
    font-weight:bold;
    box-shadow:0 5px 12px rgba(0,0,0,0.1);
}

.contact-btn:hover{
    transform:scale(1.05);
}
</style>
</head>

<body>

<!-- 🔊 CLICK SOUND (tap corto tipo UI) -->
<audio id="clickSound" src="https://assets.mixkit.co/sfx/preview/mixkit-interface-click-1126.mp3"></audio>

<div class="menu">
    <h1>Kingi Gatini Studios 🎮</h1>
    <button onclick="clickSound(); mostrar('juegos')">Juegos</button>
    <button onclick="clickSound(); mostrar('contacto')">Contacto</button>
    <button onclick="clickSound(); window.open('https://dc2016683-ship-it.github.io/artist-/','_blank')">Extras</button>
</div>

<div class="contenido" id="contenido">
    Selecciona una opción
</div>

<script>

function clickSound(){
    let sound = document.getElementById("clickSound");
    sound.currentTime = 0; // reinicia para click instantáneo
    sound.play();
}

function mostrar(opcion){
    let contenido = document.getElementById("contenido");

    if(opcion === "juegos"){
        contenido.innerHTML = `
        <div>
            Aquí están los juegos de Gatini Studios 🎮
            <div class="galeria">

                <a href="https://www.roblox.com/games/95005655847519/The-Horror-Actracion-LEAN-DESCRIPTION" target="_blank">
                    <img src="https://i.postimg.cc/5YX7SYYc/IMG-7667.jpg">
                </a>

                <a href="https://www.roblox.com/games/123514117242469/STEAL-FROM-BRAINROTS-BETA" target="_blank">
                    <img src="https://i.postimg.cc/rd8NQdHj/IMG-7665-(1).jpg">
                </a>

                <a href="https://www.roblox.com/games/101908925015733/SOVREVIVE-LA-NOCHE-DELUXE" target="_blank">
                    <img src="https://i.postimg.cc/Fd0FzRrf/IMG-7666.jpg">
                </a>

            </div>
        </div>`;
    }

    else if(opcion === "contacto"){
        contenido.innerHTML = `
        <div>
            Contacto oficial 💌<br><br>
            Envíanos un mensaje 👇<br>

            <a class="contact-btn" href="https://mail.google.com/mail/?view=cm&fs=1&to=TheGatiniStudios@gmail.com" target="_blank">
                TheGatiniStudios@gmail.com
            </a>
        </div>`;
    }
}

</script>

</body>
</html>
